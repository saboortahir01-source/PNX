<!-- landing/assets/agent-visual.svg
     PNX Agent Visual — editable gradients at the top
     Recommended usage: inline <svg> or <img src="..."> with CSS sizing.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" aria-labelledby="title desc" role="img">
  <title id="title">PNX agent visual: sources flowing into PNX intelligence</title>
  <desc id="desc">Floating source chips flow into a translucent PNX glass core; prioritized outcomes appear on the right.</desc>

  <defs>
    <!-- Brand gradients (edit these stops to tune PNX colors) -->
    <linearGradient id="g-primary" x1="0" x2="1">
      <stop offset="0" stop-color="#4A7CF7"/>
      <stop offset="1" stop-color="#7C61FF"/>
    </linearGradient>
    <linearGradient id="g-accent" x1="0" x2="1">
      <stop offset="0" stop-color="#1CC7A6"/>
      <stop offset="1" stop-color="#32D7B8"/>
    </linearGradient>

    <!-- Soft glow and card shadow -->
    <filter id="shadow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="30" flood-color="#0b1220" flood-opacity="0.06"/>
    </filter>

    <!-- subtle glass blur -->
    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Stroke for flow lines -->
    <linearGradient id="flow-line" x1="0" x2="1">
      <stop offset="0" stop-color="#4A7CF7" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#1CC7A6" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- background subtle vignette -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- left source chips group -->
  <g id="sources" transform="translate(80,120)">
    <!-- chips -->
    <g transform="translate(0,0)" opacity="0.96">
      <rect x="0" y="0" rx="12" ry="12" width="220" height="56" fill="#FBFDFF" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="36" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0B1220">Website</text>
      <rect x="0" y="76" rx="12" ry="12" width="200" height="48" fill="#fff" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="106" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0B1220">Keywords</text>
      <rect x="0" y="136" rx="12" ry="12" width="180" height="44" fill="#fff" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="162" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0B1220">SERP</text>
      <rect x="0" y="196" rx="12" ry="12" width="200" height="44" fill="#fff" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="222" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0B1220">Content</text>
      <rect x="0" y="256" rx="12" ry="12" width="220" height="44" fill="#fff" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="282" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0B1220">Competitors</text>
      <rect x="0" y="316" rx="12" ry="12" width="160" height="44" fill="#fff" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="342" font-family="Inter, Arial, sans-serif" font-size="14" fill="#0B1220">Technical SEO</text>
    </g>
  </g>

  <!-- flow lines -->
  <g id="flows" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
    <path d="M300 170 C460 150, 520 220, 610 270" stroke="url(#flow-line)" />
    <path d="M300 230 C470 240, 540 300, 640 335" stroke="url(#flow-line)" />
    <path d="M300 330 C480 320, 560 360, 700 380" stroke="url(#flow-line)" />
  </g>

  <!-- PNX glass core (center) -->
  <g id="pnx-core" transform="translate(560,200)">
    <g filter="url(#shadow-soft)">
      <rect x="-120" y="-90" width="360" height="220" rx="26" ry="26" fill="url(#g-primary)" opacity="0.06"/>
    </g>

    <!-- glass panel -->
    <g filter="url(#glass-blur)">
      <rect x="-40" y="-56" width="240" height="160" rx="20" ry="20" fill="white" opacity="0.82" stroke="rgba(11,18,32,0.06)" />
    </g>

    <!-- center content -->
    <g transform="translate(80,24)" text-anchor="middle" font-family="Inter, Arial, sans-serif">
      <text x="-80" y="-6" font-size="22" font-weight="700" fill="url(#g-primary)">PNX</text>
      <text x="-80" y="22" font-size="13" fill="rgba(11,18,32,0.6)">Working — analyzing sources</text>
    </g>

    <!-- subtle network nodes inside glass -->
    <g transform="translate(10,-10)" opacity="0.14">
      <circle cx="-10" cy="-8" r="4" fill="#4A7CF7"/>
      <circle cx="40" cy="-20" r="3.2" fill="#7C61FF"/>
      <circle cx="20" cy="18" r="2.6" fill="#1CC7A6"/>
      <path d="M-10 -8 L 40 -20 L 20 18" stroke="rgba(11,18,32,0.06)" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- outcomes (right) -->
  <g id="outcomes" transform="translate(820,160)">
    <!-- priority card 1 -->
    <g transform="translate(0,0)" filter="url(#shadow-soft)">
      <rect x="0" y="0" width="320" height="84" rx="14" fill="#FFFFFF" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="26" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1220">Top fix</text>
      <text x="18" y="48" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(11,18,32,0.7)">Improve H1 to match 'commuter bike' intent</text>
    </g>

    <!-- priority card 2 -->
    <g transform="translate(0,110)" filter="url(#shadow-soft)">
      <rect x="0" y="0" width="320" height="84" rx="14" fill="#FFFFFF" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="26" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1220">Keyword</text>
      <text x="18" y="48" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(11,18,32,0.7)">Opportunity: "best commuter ebike" — KD 22</text>
    </g>

    <!-- priority card 3 -->
    <g transform="translate(0,220)" filter="url(#shadow-soft)">
      <rect x="0" y="0" width="320" height="84" rx="14" fill="#FFFFFF" stroke="rgba(11,18,32,0.04)"/>
      <text x="18" y="26" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1220">SERP Insight</text>
      <text x="18" y="48" font-family="Inter, Arial, sans-serif" font-size="13" fill="rgba(11,18,32,0.7)">Top pages favor longer how-to sections.</text>
    </g>
  </g>

  <!-- decorative faint grid/network behind -->
  <g transform="translate(380,30)" opacity="0.06">
    <path d="M0 80 C140 -20, 340 20, 520 0" stroke="#7C61FF" stroke-width="2" fill="none"/>
    <path d="M0 160 C160 80, 360 140, 600 120" stroke="#1CC7A6" stroke-width="2" fill="none"/>
  </g>
</svg>
