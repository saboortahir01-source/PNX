<!-- landing/assets/arc-background.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bgArcA" x1="0" x2="1">
      <stop offset="0" stop-color="#EBF5FF"/>
      <stop offset="1" stop-color="#F7F6FF"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- large soft arc -->
  <g opacity="0.95" filter="url(#soft)">
    <path d="M-200 420 C300 140, 900 140, 1500 420 L1500 680 L-200 680 Z" fill="url(#bgArcA)"/>
  </g>

  <!-- subtle network lines -->
  <g opacity="0.08" stroke="#4A7CF7" stroke-width="2" fill="none">
    <path d="M120 480 C420 320, 840 320, 1200 480"/>
    <path d="M60 520 C420 360, 900 360, 1420 520"/>
  </g>
</svg>
