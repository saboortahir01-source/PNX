    <path d="M22 2c-6 2-11 7-14 13-3 6-3 13 1 19 4 6 11 9 17 9 2 0 4 0 6-1 3-1 6-3 8-6 3-4 4-9 3-14-2-9-10-18-21-20z" fill="url(#g)" />
  </g>
