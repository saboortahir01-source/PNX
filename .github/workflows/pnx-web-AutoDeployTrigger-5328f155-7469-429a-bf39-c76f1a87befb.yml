name: Deploy PNX to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/saboortahir01-source/pnx

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PNX image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PNXWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PNXWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PNXWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Configure GHCR access
        run: |
          az containerapp registry set \
            --name pnx-web \
            --resource-group rg-dainny46-8104 \
            --server ghcr.io \
            --username "${{ secrets.GHCR_USERNAME }}" \
            --password "${{ secrets.GHCR_TOKEN }}"

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --name pnx-web \
            --resource-group rg-dainny46-8104 \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}"
